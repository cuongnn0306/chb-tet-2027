name: Staging database

# Applies migrations to the STAGING Supabase project when `develop` changes (INF-009).
# The app itself deploys through Vercel's Git integration (INF-011).
#
# Inactive until a human provisions staging (see docs/runbooks/STAGING_DEPLOY.md):
#   repo variable   STAGING_CONFIGURED = true
#   repo secrets    SUPABASE_ACCESS_TOKEN, STAGING_PROJECT_REF, STAGING_DB_PASSWORD
# Use a GitHub environment named "staging" for these values; never reuse production values.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  db-push:
    if: ${{ vars.STAGING_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
      - run: npx supabase db push --dry-run
      - run: npx supabase db push
