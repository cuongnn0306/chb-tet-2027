name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rebuilds the local DB from migrations + seed; fails if the repo is not reproducible.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: npx supabase db reset
      - run: npm run test:integration
      - if: always()
        run: npx supabase stop --no-backup
